<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; }
      #game { position: fixed; inset: 0; touch-action: none; }
      .loading { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: #120c07; font-family: 'Palatino Linotype', Palatino, Georgia, serif; color: #f4ecd6; }
      .loading .box { width: min(420px, 80vw); text-align: center; }
      .loading h1 { letter-spacing: 0.16em; font-size: 44px; margin: 0 0 14px; color: #f4e4b0; }
      .loading .bar { height: 10px; background: rgba(0,0,0,.45); border: 1px solid #000; border-radius: 5px; overflow: hidden; }
      .loading .bar i { display: block; height: 100%; background: linear-gradient(180deg, #d9aa44, #96691c); transition: width .25s; }
      .loading p { color: #c9b994; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div class="loading" id="loading"><div class="box"><h1>MOAT</h1><div class="bar"><i id="loading-bar" style="width:3%"></i></div><p id="loading-text">Surveying the land…</p></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
