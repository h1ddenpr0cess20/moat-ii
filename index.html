<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moat II: Blood Moat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #08050a; overflow: hidden; }
      #game { position: fixed; inset: 0; touch-action: none; }
      .loading { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #2a0a10, #08050a 70%); font-family: 'Palatino Linotype', Palatino, Georgia, serif; color: #ecdcd0; }
      .loading .box { width: min(420px, 80vw); text-align: center; }
      .loading h1 { letter-spacing: 0.16em; font-size: 44px; margin: 0 0 14px; color: #e8d8c8; text-shadow: 0 0 24px rgba(200, 20, 20, 0.6); }
      .loading h1 small { display: block; font-size: 15px; letter-spacing: 0.32em; color: #c8202a; margin-top: 4px; }
      .loading .bar { height: 10px; background: rgba(0,0,0,.45); border: 1px solid #000; border-radius: 5px; overflow: hidden; }
      .loading .bar i { display: block; height: 100%; background: linear-gradient(180deg, #c8202a, #6a0a10); transition: width .25s; }
      .loading p { color: #b8a0a0; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div class="loading" id="loading"><div class="box"><h1>MOAT II<small>BLOOD MOAT</small></h1><div class="bar"><i id="loading-bar" style="width:3%"></i></div><p id="loading-text">Filling the moat…</p></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
